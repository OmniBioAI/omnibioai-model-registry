<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const root = document.documentElement;
        const params = new URLSearchParams(window.location.search);
        const themes = ['light', 'dark'];
        const accents = ['teal', 'blue', 'purple', 'orange'];
        const densities = ['comfortable', 'compact'];
        const motions = ['system', 'reduce'];
        const systemTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        const choose = (name, choices, fallback) => choices.includes(params.get(`obai_${name}`)) ? params.get(`obai_${name}`) : fallback;

        root.dataset.theme = choose('theme', themes, systemTheme);
        root.dataset.accent = choose('accent', accents, 'teal');
        root.dataset.density = choose('density', densities, 'comfortable');
        root.dataset.motion = choose('motion', motions, 'system');
        root.dataset.embedded = window.parent !== window ? 'true' : 'false';

        const privateKeys = new Set([
          'token', 'access_token', 'refresh_token', 'id_token', 'password', 'api_key', 'api-key',
          'session', 'session_id', 'secret', 'client_secret', 'credential', 'authorization', 'auth',
          'user_id', 'email', 'organization', 'organization_id', 'account', 'account_id',
        ]);
        let changed = false;
        for (const key of Array.from(params.keys())) {
          if (key.toLowerCase().startsWith('obai_') || privateKeys.has(key.toLowerCase())) {
            params.delete(key);
            changed = true;
          }
        }
        if (changed) {
          const query = params.toString();
          window.history.replaceState(window.history.state, '', window.location.pathname + (query ? `?${query}` : '') + window.location.hash);
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>omnibioai-model-registry-ui</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
