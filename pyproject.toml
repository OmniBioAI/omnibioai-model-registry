[build-system]
requires = ["setuptools>=68", "wheel", "Cython>=3.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibioai-model-registry"
version = "0.1.4"
description = "Production-grade model registry for the OmniBioAI ecosystem."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [{ name = "Manish Kumar" }]

keywords = [
  "model-registry",
  "mlops",
  "bioinformatics",
  "ai",
  "machine-learning",
  "artifact-management",
  "reproducibility",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Software Development :: Libraries",
]

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "PyYAML>=6.0.1",
  "httpx>=0.27.0",
  "boto3>=1.34.0",
  "PyMySQL>=1.1.0",
  "cryptography>=41.0.0",
  "PyJWT>=2.8.0",
  "huggingface_hub>=0.20.0",
  # Model Registry IAM integration: centralized JWT verification via the
  # shared IAM client. Pinned direct git reference -- omnibioai-iam-client
  # is a private repo distributed via git+https, not a package index
  # (GitHub Packages has no PyPI-format registry). See that repo's README
  # for the full distribution model.
  "omnibioai-iam-client @ git+https://github.com/OmniBioAI/omnibioai-iam-client.git@v0.1.2",

  # PR14.2B-3: usage-metering event emission (usage_emit.py). Same
  # private-repo pinned-tag distribution convention as omnibioai-iam-client.
  "omnibioai-usage-client @ git+https://github.com/OmniBioAI/omnibioai-usage-client.git@v0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "black==26.3.1",
  "ruff>=0.1.0",
  "mypy>=1.0",
]

[project.scripts]
omr = "omnibioai_model_registry.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["omnibioai_model_registry*"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.coverage.run]
branch = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=omnibioai_model_registry --cov-report=term-missing --cov-fail-under=95"
