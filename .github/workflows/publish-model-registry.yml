name: Publish Model Registry

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source commit to publish
        required: true
        default: fadc51719a25bce5abf007ae605bf5184f3055bf
        type: string
      source_ref:
        description: Immutable remote ref resolving to source_sha
        required: true
        default: model-registry-source-fadc517
        type: string
      version:
        description: New immutable release version, for example v0.1.4
        required: true
        default: v0.1.4
        type: string
      publish_latest:
        description: Also publish latest (normally false)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  IMAGE: ghcr.io/omnibioai/omnibioai-model-registry
  SOURCE_REPOSITORY: https://github.com/OmniBioAI/omnibioai-model-registry

jobs:
  test:
    name: Test frozen source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: omnibioai-model-registry

      - name: Assert exact source revision
        working-directory: omnibioai-model-registry
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "${#SOURCE_SHA}" -eq 40
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies securely
        working-directory: omnibioai-model-registry
        env:
          MODEL_REGISTRY_GITHUB_TOKEN: ${{ secrets.SECRETS }}
        run: |
          set -eu
          ASKPASS="$RUNNER_TEMP/model-registry-git-askpass"
          umask 077
          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$MODEL_REGISTRY_GITHUB_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          trap 'rm -f "$ASKPASS"' EXIT
          GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 python -m pip install --upgrade pip
          GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 python -m pip install -e ".[dev]"
          python -m pip install ruff pytest

      - name: Ruff
        working-directory: omnibioai-model-registry
        run: ruff check .

      - name: Pytest and coverage
        working-directory: omnibioai-model-registry
        run: pytest --cov=omnibioai_model_registry --cov-report=term-missing --cov-fail-under=95 -q

  build_amd64:
    name: Native linux/amd64 image
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout exact source in parent workspace layout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: omnibioai-model-registry

      - name: Assert native AMD64 and exact source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(uname -m)" = x86_64
          test "${#SOURCE_SHA}" -eq 40
          test "$SOURCE_SHA" = "$(git -C omnibioai-model-registry rev-parse HEAD)"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable AMD64 artifact
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: omnibioai-model-registry/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.version }}-amd64-${{ inputs.source_sha }}
          secrets: |
            github_token=${{ secrets.SECRETS }}
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE_REPOSITORY }}
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build_arm64:
    name: Native linux/arm64 image
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout exact source in parent workspace layout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: omnibioai-model-registry

      - name: Assert native ARM64 and exact source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(uname -m)" = aarch64
          test "${#SOURCE_SHA}" -eq 40
          test "$SOURCE_SHA" = "$(git -C omnibioai-model-registry rev-parse HEAD)"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable ARM64 artifact
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: omnibioai-model-registry/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.version }}-arm64-${{ inputs.source_sha }}
          secrets: |
            github_token=${{ secrets.SECRETS }}
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE_REPOSITORY }}
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  assemble_and_verify:
    name: Assemble and independently verify remote release
    needs: [build_amd64, build_arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate inputs and assemble immutable OCI index
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          AMD64_DIGEST: ${{ needs.build_amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build_arm64.outputs.digest }}
        run: |
          set -eu
          test "${#SOURCE_SHA}" -eq 40
          printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          test -n "$AMD64_DIGEST"
          test -n "$ARM64_DIGEST"
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:$SOURCE_SHA" \
            "$IMAGE@$AMD64_DIGEST" \
            "$IMAGE@$ARM64_DIGEST"
          if [ "${{ inputs.publish_latest }}" = true ]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"
          fi

      - name: Verify remote index platforms and digest
        id: verify
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          docker buildx imagetools inspect "$IMAGE:$VERSION" | tee /tmp/model-registry-index.txt
          INDEX_DIGEST=$(docker buildx imagetools inspect "$IMAGE:$VERSION" | awk '/^Digest:/ {print $2; exit}')
          test -n "$INDEX_DIGEST"
          grep -q 'Platform:    linux/amd64' /tmp/model-registry-index.txt
          grep -q 'Platform:    linux/arm64' /tmp/model-registry-index.txt
          echo "INDEX_METADATA=PASS"
          echo "INDEX_PLATFORMS=PASS"
          echo "INDEX_DIGEST=$INDEX_DIGEST"

      - name: Verify named architecture, metadata, and attestations
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          SOURCE_REPOSITORY: ${{ env.SOURCE_REPOSITORY }}
        run: |
          set -eu
          test "${#SOURCE_SHA}" -eq 40
          for arch in amd64 arm64; do
            ref="$IMAGE:$VERSION-$arch-$SOURCE_SHA"

            # Buildx attestations (sbom/provenance) make this per-arch tag
            # resolve to a 2-manifest OCI index: the real platform image
            # manifest plus a sibling attestation-manifest. The human-oriented
            # `imagetools inspect` summary of that index never surfaces the
            # platform image's own Config.Labels, so grepping it (as this
            # step previously did) can never find org.opencontainers.* labels
            # and can accidentally match unrelated substrings elsewhere in
            # the index/attestation text. Resolve each descriptor explicitly
            # by digest instead, and compare labels with exact equality.
            index_json=$(docker buildx imagetools inspect "$ref" --raw)

            runtime_digest=$(printf '%s' "$index_json" | jq -r \
              --arg arch "$arch" \
              '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)] | if length == 1 then .[0].digest else empty end')
            attest_digest=$(printf '%s' "$index_json" | jq -r \
              '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | if length == 1 then .[0].digest else empty end')
            test -n "$runtime_digest"
            test -n "$attest_digest"

            # --- Platform metadata: exact match against the real image config ---
            labels=$(docker buildx imagetools inspect "$IMAGE@$runtime_digest" --format '{{json .Image.Config.Labels}}')
            actual_source=$(printf '%s' "$labels" | jq -r '."org.opencontainers.image.source" // empty')
            actual_revision=$(printf '%s' "$labels" | jq -r '."org.opencontainers.image.revision" // empty')
            actual_version=$(printf '%s' "$labels" | jq -r '."org.opencontainers.image.version" // empty')
            test "$actual_source" = "$SOURCE_REPOSITORY"
            test "${#actual_revision}" -eq 40
            test "$actual_revision" = "$SOURCE_SHA"
            test "$actual_version" = "$VERSION"
            echo "${arch^^}_METADATA=PASS"

            # --- Supply chain: OCI-native in-toto attestations, subject-bound
            # to this exact immutable platform digest (not merely present) ---
            attest_json=$(docker buildx imagetools inspect "$IMAGE@$attest_digest" --raw)
            subject_digest=$(printf '%s' "$attest_json" | jq -r '.subject.digest // empty')
            test "$subject_digest" = "$runtime_digest"
            predicate_types=$(printf '%s' "$attest_json" | jq -r '[.layers[]? | select(.mediaType == "application/vnd.in-toto+json") | .annotations["in-toto.io/predicate-type"]] | sort | join(",")')
            printf '%s' "$predicate_types" | grep -q 'https://spdx.dev/Document'
            printf '%s' "$predicate_types" | grep -q 'https://slsa.dev/provenance/v1'
            echo "${arch^^}_SBOM=PASS (OCI-native, subject=$subject_digest)"
            echo "${arch^^}_PROVENANCE=PASS (OCI-native, subject=$subject_digest)"
          done

          VERSION_DIGEST=$(docker buildx imagetools inspect "$IMAGE:$VERSION" | awk '/^Digest:/ {print $2; exit}')
          SOURCE_DIGEST=$(docker buildx imagetools inspect "$IMAGE:$SOURCE_SHA" | awk '/^Digest:/ {print $2; exit}')
          test -n "$VERSION_DIGEST"
          test "$VERSION_DIGEST" = "$SOURCE_DIGEST"
          echo "TAG_DIGESTS=PASS"

  smoke_amd64:
    name: Runtime smoke (native linux/amd64)
    needs: [build_amd64, build_arm64, assemble_and_verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    env:
      DIGEST: ${{ needs.build_amd64.outputs.digest }}
    steps:
      - name: Assert native AMD64 runner
        run: test "$(uname -m)" = x86_64

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull immutable AMD64 artifact by digest
        run: |
          set -eu
          test -n "$DIGEST"
          docker pull --platform linux/amd64 "$IMAGE@$DIGEST"

      - name: Run container and probe /health
        run: |
          set -eu
          # OMNIBIOAI_MODEL_REGISTRY_ROOT is a mandatory, security-relevant
          # (path-safety sandbox boundary) config value with no application
          # default by design -- see config.py/path_safety.py and the
          # documented production `docker run` contract in README.md (it
          # passes this same env var explicitly). The value here is an
          # ephemeral, container-local path (auto-created by localfs.py),
          # matching the same convention the repo's own disabled legacy
          # CI workflow already used for test runs.
          cid=$(docker run -d --platform linux/amd64 -p 18095:8095 \
            -e OMNIBIOAI_MODEL_REGISTRY_ROOT=/data/model_registry \
            "$IMAGE@$DIGEST")
          cleanup() {
            status=$?
            docker logs "$cid" 2>&1 | tail -n 100 || true
            docker rm -f "$cid" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          response=""
          for _ in $(seq 1 30); do
            if response=$(curl -sf --max-time 3 http://127.0.0.1:18095/health); then
              break
            fi
            response=""
            sleep 2
          done
          test -n "$response"
          printf '%s' "$response" | python3 -c "import json, sys; body = json.load(sys.stdin); assert body.get('ok') is True, body; assert body.get('service') == 'omnibioai-model-registry', body"
          echo "AMD64_RUNTIME_SMOKE=PASS"

  smoke_arm64:
    name: Runtime smoke (native linux/arm64)
    needs: [build_amd64, build_arm64, assemble_and_verify]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    env:
      DIGEST: ${{ needs.build_arm64.outputs.digest }}
    steps:
      - name: Assert native ARM64 runner
        run: test "$(uname -m)" = aarch64

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull immutable ARM64 artifact by digest
        run: |
          set -eu
          test -n "$DIGEST"
          docker pull --platform linux/arm64 "$IMAGE@$DIGEST"

      - name: Run container and probe /health
        run: |
          set -eu
          # See the AMD64 smoke job for why this env var is required.
          cid=$(docker run -d --platform linux/arm64 -p 18095:8095 \
            -e OMNIBIOAI_MODEL_REGISTRY_ROOT=/data/model_registry \
            "$IMAGE@$DIGEST")
          cleanup() {
            status=$?
            docker logs "$cid" 2>&1 | tail -n 100 || true
            docker rm -f "$cid" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          response=""
          for _ in $(seq 1 30); do
            if response=$(curl -sf --max-time 3 http://127.0.0.1:18095/health); then
              break
            fi
            response=""
            sleep 2
          done
          test -n "$response"
          printf '%s' "$response" | python3 -c "import json, sys; body = json.load(sys.stdin); assert body.get('ok') is True, body; assert body.get('service') == 'omnibioai-model-registry', body"
          echo "ARM64_RUNTIME_SMOKE=PASS"
